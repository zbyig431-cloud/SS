<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>モンスト 絆ゲージ管理ツール(カレンダー対応版)</title>
  <style>
    :root {
      /* ダークテーマに合わせた配色 */
      --bg-color: rgba(30, 41, 59, 0.7); /* 半透明の暗い背景 */
      --card-bg: rgba(30, 41, 59, 0.9); /* さらに不透明なカード背景 */
      --primary-color: #3b82f6; /* プライマリーブルー */
      --danger-color: #ef4444; /* デンジャーレッド */
      --warning-color: #f59e0b; /* 警告オレンジ */
      --text-color: #e5e7eb; /* 明るいテキストカラー */
      --border-color: rgba(229, 231, 235, 0.2); /* 半透明のボーダー */
      --input-bg: rgba(255, 255, 255, 0.05); /* 入力フィールドの半透明背景 */
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      /* 背景画像の設定 */
      background-image: url('image_0.png'); /* 画像ファイルを指定 */
      background-size: cover; /* 画面全体を覆う */
      background-position: center; /* 中央に配置 */
      background-attachment: fixed; /* スクロールしても固定 */
      background-color: #111827; /* フォールバックカラー */
      color: var(--text-color);
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
      min-height: 100vh; /* 最低限の高さ */
    }

    .container {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    h1 {
      font-size: 1.5rem;
      text-align: center;
      margin: 0 0 8px 0;
      color: white;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1); /* 少し影を強める */
      backdrop-filter: blur(5px); /* ガラスのようなぼかし効果 */
      border: 1px solid var(--border-color);
    }

    /* 日付選択カレンダー */
    .date-control {
      text-align: center;
      margin-bottom: 16px;
    }
    .date-control label {
      font-size: 1rem;
      margin-right: 8px;
    }
    input[type="date"] {
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 10px;
      border-radius: 8px;
      font-size: 1rem;
      font-family: inherit;
    }

    /* 選択日の進捗カウンター */
    .today-counter {
      text-align: center;
      background: linear-gradient(135deg, #1e40af, #3b82f6);
      color: white;
    }
    .today-counter h2 {
      margin: 0 0 4px 0;
      font-size: 1rem;
      opacity: 0.9;
    }
    .today-count-val {
      font-size: 2.5rem;
      font-weight: bold;
    }

    /* 登録フォーム */
    .add-form {
      display: flex;
      gap: 8px;
    }
    .add-form input[type="text"] {
      flex: 1;
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 1rem;
      background-color: var(--input-bg);
      color: var(--text-color);
    }

    button {
      padding: 10px 14px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:active {
      opacity: 0.8;
    }
    .btn-primary { background-color: var(--primary-color); color: white; }
    .btn-success { background-color: #10b981; color: white; }
    .btn-done { background-color: #9ca3af; color: white; }
    .btn-danger { background-color: var(--danger-color); color: white; }
    .btn-edit { background-color: #6b7280; color: white; }
    .btn-sort { background-color: #374151; color: var(--text-color); font-weight: normal; font-size: 0.85rem; border: 1px solid var(--border-color); }
    .btn-sort.active { background-color: var(--primary-color); color: white; font-weight: bold; border: none; }

    /* ソートボタンエリア */
    .sort-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .sort-label {
      font-size: 0.85rem;
      color: #9ca3af;
    }

    /* フレンドリスト */
    .friend-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .friend-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background-color: rgba(255, 255, 255, 0.05); /* 半透明のリフト背景 */
      gap: 8px;
    }

    .friend-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .friend-name {
      font-weight: bold;
      font-size: 1.05rem;
      color: white;
    }

    .friend-count {
      font-size: 0.9rem;
      color: #d1d5db;
    }

    /* 9回目・19回目の強調 */
    .reach-warning {
      color: var(--danger-color);
      font-weight: bold;
      font-size: 0.95rem;
    }

    .friend-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* モーダルダイアログ */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
      backdrop-filter: blur(5px);
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      width: 90%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      border: 1px solid var(--border-color);
    }
    .modal h3 {
      margin: 0;
      color: white;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>絆ゲージ管理ツール</h1>

    <!-- 日付選択カレンダー -->
    <div class="date-control">
      <label for="dateInput">日付を選択:</label>
      <input type="date" id="dateInput" onchange="render()">
    </div>

    <!-- 選択日の達成数 -->
    <div class="card today-counter">
      <h2 id="dateCountLabel">選択日の達成人数</h2>
      <div class="today-count-val" id="todayCount">0人</div>
    </div>

    <!-- フレンド追加フォーム -->
    <div class="card">
      <form class="add-form" id="addFriendForm">
        <input type="text" id="friendNameInput" placeholder="フレンド名を入力" required>
        <button type="submit" class="btn-primary">追加</button>
      </form>
    </div>

    <!-- ソート切替 ＆ リスト表示 -->
    <div class="card">
      <div class="sort-controls" style="margin-bottom: 12px;">
        <span class="sort-label">並び替え:</span>
        <button class="btn-sort active" id="btnSortCreated" onclick="setSort('created')">登録日順</button>
        <button class="btn-sort" id="btnSortKana" onclick="setSort('kana')">五十音順</button>
        <button class="btn-sort" id="btnSortProgress" onclick="setSort('progress')">進捗順</button>
      </div>

      <ul class="friend-list" id="friendList"></ul>
    </div>
  </div>

  <!-- 名前編集モーダル -->
  <div class="modal-overlay" id="editModal">
    <div class="modal">
      <h3>フレンド名の編集</h3>
      <input type="text" id="editNameInput" style="padding: 10px; border: 1px solid var(--border-color); border-radius: 8px; background-color: var(--input-bg); color: var(--text-color);">
      <div style="display: flex; gap: 8px; justify-content: flex-end;">
        <button onclick="closeEditModal()" style="background: #6b7280; color: white;">キャンセル</button>
        <button onclick="saveEditName()" class="btn-primary">保存</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'monst_kizuna_friends_data_v2'; // カレンダー対応に伴いキーを更新
    
    let friends = [];
    let currentSort = 'created';
    let editingFriendId = null;

    // 今日の日付を取得 (YYYY-MM-DD)
    function getTodayString() {
      const today = new Date();
      return today.toISOString().split('T')[0];
    }

    // 初期化ロード
    function loadData() {
      const data = localStorage.getItem(STORAGE_KEY);
      if (data) {
        friends = JSON.parse(data);
        
        // 旧データ形式(lastCompletedDate)から新データ形式(completedDates)へのマイグレーション処理
        friends = friends.map(friend => {
          if (!friend.completedDates) {
            return {
              ...friend,
              completedDates: friend.lastCompletedDate ? [friend.lastCompletedDate] : []
            };
          }
          return friend;
        });
        saveData(); // マイグレーション後のデータを保存
      }
      // カレンダーを今日の日付に設定
      document.getElementById('dateInput').value = getTodayString();
      render();
    }

    // セーブ
    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(friends));
    }

    // 新規登録
    document.getElementById('addFriendForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const input = document.getElementById('friendNameInput');
      const name = input.value.trim();
      if (!name) return;

      const newFriend = {
        id: Date.now().toString(),
        name: name,
        totalCount: 0,
        completedDates: [], // 完了した日付のリスト
        createdAt: Date.now()
      };

      friends.push(newFriend);
      saveData();
      input.value = '';
      render();
    });

    // 選択された日付を取得
    function getSelectedDateString() {
      return document.getElementById('dateInput').value;
    }

    // 選択日の達成数カウント
    function updateTodayCount(selectedDate) {
      const count = friends.filter(f => f.completedDates.includes(selectedDate)).length;
      
      // ラベルを選択日に合わせて更新
      const todayStr = getTodayString();
      const label = document.getElementById('dateCountLabel');
      if (selectedDate === todayStr) {
        label.textContent = '本日の達成人数';
      } else {
        label.textContent = `${selectedDate} の達成人数`;
      }

      document.getElementById('todayCount').textContent = `${count}人`;
    }

    // 完了トグル (選択日完了済みなら解除、未完了なら達成)
    function toggleComplete(id) {
      const selectedDate = getSelectedDateString();
      const friend = friends.find(f => f.id === id);
      if (!friend) return;

      if (friend.completedDates.includes(selectedDate)) {
        // 選択日の完了を取り消す
        friend.completedDates = friend.completedDates.filter(date => date !== selectedDate);
        friend.totalCount = Math.max(0, friend.totalCount - 1);
      } else {
        // 選択日を完了にする
        friend.completedDates.push(selectedDate);
        friend.totalCount += 1;
      }

      saveData();
      render();
    }

    // ソート基準の変更
    function setSort(sortType) {
      currentSort = sortType;
      
      // ボタンのアクティブ状態を切り替え
      document.querySelectorAll('.btn-sort').forEach(btn => btn.classList.remove('active'));
      if (sortType === 'created') document.getElementById('btnSortCreated').classList.add('active');
      if (sortType === 'kana') document.getElementById('btnSortKana').classList.add('active');
      if (sortType === 'progress') document.getElementById('btnSortProgress').classList.add('active');
      
      render();
    }

    // 削除
    function deleteFriend(id) {
      const friend = friends.find(f => f.id === id);
      if (confirm(`「${friend.name}」を削除してもよろしいですか？`)) {
        friends = friends.filter(f => f.id !== id);
        saveData();
        render();
      }
    }

    // 名前編集ダイアログ表示
    function openEditModal(id) {
      editingFriendId = id;
      const friend = friends.find(f => f.id === id);
      document.getElementById('editNameInput').value = friend.name;
      document.getElementById('editModal').classList.add('active');
    }

    function closeEditModal() {
      editingFriendId = null;
      document.getElementById('editModal').classList.remove('active');
    }

    function saveEditName() {
      const newName = document.getElementById('editNameInput').value.trim();
      if (!newName) return;

      const friend = friends.find(f => f.id === editingFriendId);
      if (friend) {
        friend.name = newName;
        saveData();
        render();
      }
      closeEditModal();
    }

    // 表示用データの計算 (20回で1周、1〜20表記)
    function getDisplayCount(totalCount) {
      if (totalCount === 0) return 0;
      const rem = totalCount % 20;
      return rem === 0 ? 20 : rem;
    }

    // リスト描画
    function render() {
      const selectedDate = getSelectedDateString();
      updateTodayCount(selectedDate);
      
      const listEl = document.getElementById('friendList');
      listEl.innerHTML = '';

      // ソート処理
      let sorted = [...friends];
      if (currentSort === 'kana') {
        sorted.sort((a, b) => a.name.localeCompare(b.name, 'ja'));
      } else if (currentSort === 'progress') {
        // 回数が多い順 (同数の場合は登録日順)
        sorted.sort((a, b) => b.totalCount - a.totalCount || a.createdAt - b.createdAt);
      } else {
        // 登録日順
        sorted.sort((a, b) => a.createdAt - b.createdAt);
      }

      const todayStr = getTodayString();

      sorted.forEach(friend => {
        const displayCount = getDisplayCount(friend.totalCount);
        const isReach = displayCount === 9 || displayCount === 19;
        
        // 選択日が完了済みかどうかを判定
        const isDoneOnSelectedDate = friend.completedDates.includes(selectedDate);
        // 本日が完了済みかどうかを判定 (9回目・19回目の強調メッセージ用)
        const isDoneToday = friend.completedDates.includes(todayStr);

        const li = document.createElement('li');
        li.className = 'friend-item';

        // 強調メッセージの切り替え
        let reachNoticeHtml = '';
        if (isReach) {
          const ticketNum = displayCount === 9 ? '1枚目' : '2枚目';
          reachNoticeHtml = `<span class="reach-warning">★ 次でオーブチケット（${ticketNum}）獲得！</span>`;
        }

        li.innerHTML = `
          <div class="friend-info">
            <div class="friend-name">${escapeHtml(friend.name)}</div>
            <div class="friend-count">
              現在: <strong>${displayCount}</strong> / 20回 (通算 ${friend.totalCount}回)
            </div>
            ${reachNoticeHtml}
          </div>
          <div class="friend-actions">
            <button 
              class="${isDoneOnSelectedDate ? 'btn-done' : 'btn-success'}" 
              onclick="toggleComplete('${friend.id}')">
              ${isDoneOnSelectedDate ? '選択日完了' : '完了'}
            </button>
            <button class="btn-edit" onclick="openEditModal('${friend.id}')">編集</button>
            <button class="btn-danger" onclick="deleteFriend('${friend.id}')">削除</button>
          </div>
        `;

        listEl.appendChild(li);
      });
    }

    // HTMLエスケープ処理
    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, function(m) {
        return {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#039;'
        }[m];
      });
    }

    // アプリ起動
    loadData();
  </script>
</body>
</html>
